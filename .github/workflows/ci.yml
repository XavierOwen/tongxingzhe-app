name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.2

jobs:
  flutter-quality:
    name: Flutter quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test integration_test test_driver tool

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: flutter test --no-pub

      - name: Verify production boundary
        run: dart run tool/check_production_boundary.dart

      - name: Verify Markdown links
        run: dart run tool/check_markdown_links.dart

      - name: Verify current Drift v17 schema snapshot
        run: |
          dart run drift_dev schema dump \
            lib/data/local_database.dart \
            "${RUNNER_TEMP}/drift_schema_v17.json"
          cmp drift_schemas/drift_schema_v17.json \
            "${RUNNER_TEMP}/drift_schema_v17.json"

      - name: Verify Drift migration helpers are current
        run: |
          mkdir -p "${RUNNER_TEMP}/generated_migrations"
          dart run drift_dev schema generate \
            drift_schemas \
            "${RUNNER_TEMP}/generated_migrations"
          diff -ru test/generated_migrations \
            "${RUNNER_TEMP}/generated_migrations"

  postgres-migrations:
    name: PostgreSQL rebuild, permissions, and restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify PostgreSQL test script syntax
        run: bash -n tool/run_postgres_tests_in_docker.sh tool/verify_*_concurrency.sh

      - name: Run complete auto-discovered PostgreSQL suite
        run: ./tool/run_postgres_tests_in_docker.sh

  backend-server:
    name: Backend identity, context, and sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/server/package-lock.json

      - name: Install Backend dependencies
        run: npm --prefix backend/server ci

      - name: Check and test Backend
        run: |
          npm --prefix backend/server run check
          npm --prefix backend/server test

  platform-build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            os: ubuntu-latest
            command: flutter build apk --debug --no-pub
          - target: Web
            os: ubuntu-latest
            command: flutter build web --release --no-pub
          - target: Linux
            os: ubuntu-latest
            command: flutter config --enable-linux-desktop && flutter build linux --debug --no-pub
          - target: iOS
            os: macos-latest
            command: flutter build ios --debug --no-codesign --no-pub
          - target: macOS
            os: macos-latest
            command: ./tool/build_macos_unsigned.sh
          - target: Windows
            os: windows-latest
            command: flutter config --enable-windows-desktop && flutter build windows --debug --no-pub
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java for Android
        if: matrix.target == 'Android'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux native dependencies
        if: matrix.target == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build
        shell: bash
        run: ${{ matrix.command }}
